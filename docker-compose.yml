services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-rul-femto-ims-comsol:py311-cpu
    working_dir: /workspace
    init: true
    environment:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      MPLBACKEND: Agg
    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
      - type: bind
        source: ./outputs
        target: /workspace/outputs
    command:
      - python
      - scripts/reproduce_femto_ims_to_comsol.py
      - --phase
      - all
      - --data-root
      - /workspace/data
      - --output-root
      - /workspace/outputs/reproducibility/femto_ims_to_comsol

  engineering-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-rul-femto-ims-comsol:py311-cpu
    working_dir: /workspace
    init: true
    environment:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      MPLBACKEND: Agg
    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
      - type: bind
        source: ./outputs
        target: /workspace/outputs
    ports:
      - "8090:8090"
    command:
      - python
      - scripts/run_engineering_demo.py
      - --experiment-output
      - /workspace/outputs/femto_ims_to_comsol_outerloo_v5_exploratory_fitonly_innerloo_full5x120_20260825
      - --output
      - /workspace/outputs/engineering_demo/femto_ims_to_comsol_v5
      - --host
      - 0.0.0.0
      - --port
      - "8090"
