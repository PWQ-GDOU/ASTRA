services:
  reproduce:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-rul-femto-ims-comsol:py311-cpu
    working_dir: /workspace
    init: true
    environment:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      NUMEXPR_NUM_THREADS: "4"
      MPLBACKEND: Agg
    volumes:
      - type: bind
        source: ./data
        target: /workspace/data
        read_only: true
      - type: bind
        source: ./outputs
        target: /workspace/outputs
    command:
      - python
      - scripts/reproduce_femto_ims_to_comsol.py
      - --phase
      - all
      - --data-root
      - /workspace/data
      - --output-root
      - /workspace/outputs/reproducibility/femto_ims_to_comsol
